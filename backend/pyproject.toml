[project]
name = "licenceiq-api"
version = "0.1.0"
description = "Typed API foundation for LicenceIQ document intelligence."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "minio>=7.2,<8",
    "openai>=2,<3",
    "pillow>=11,<13",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pwdlib[argon2]>=0.3,<1",
    "PyJWT>=2.10,<3",
    "pypdf>=6,<7",
    "pypdfium2>=4.30,<6",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
warn_required_dynamic_aliases = true
